services:
  - type: web
    name: acai-da-orla-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm run render:build
    startCommand: npm run start:prod
    healthCheckPath: /cardapio
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
