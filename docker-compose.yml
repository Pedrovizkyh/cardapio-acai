services:
  db:
    image: docker.io/library/postgres:17-alpine
    container_name: acai-db
    environment:
      POSTGRES_USER: acai
      POSTGRES_PASSWORD: acai
      POSTGRES_DB: acai
    ports:
      - "5432:5432"
    volumes:
      - acai-db-data:/var/lib/postgresql/data

volumes:
  acai-db-data:
